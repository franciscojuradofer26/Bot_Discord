<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zazy DJ - Panel de Control</title>
    <style>
        body {
            background: linear-gradient(135deg, #0d0614 0%, #1b1035 100%);
            color: #f2f3f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .tarjeta {
            background-color: rgba(20, 15, 40, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.15), 0 0 30px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.3);
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(12px);
        }
        
        .avatar-container {
            margin: 0 auto 25px auto;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            padding: 6px;
            transition: all 0.8s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Estado 1: Apagado / Cargando */
        .avatar-container.apagado {
            border: 4px solid #4f545c;
            box-shadow: 0 0 15px rgba(79, 84, 92, 0.5);
            filter: grayscale(80%) brightness(0.7);
        }
        
        /* Estado 2: Encendido */
        .avatar-container.encendido {
            border: 4px solid #23a559; 
            box-shadow: 0 0 25px rgba(35, 165, 89, 0.8), inset 0 0 15px rgba(35, 165, 89, 0.5);
            filter: grayscale(0%) brightness(1);
        }

        /* Estado 3: Error */
        .avatar-container.error {
            border: 4px solid #ed4245; 
            box-shadow: 0 0 25px rgba(237, 66, 69, 0.8), inset 0 0 15px rgba(237, 66, 69, 0.5);
            filter: grayscale(0%) brightness(1);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
            margin-top: 0;
            letter-spacing: 1px;
        }
        .texto-zazy {
            color: #ff00ff;
            text-shadow: 0 0 12px rgba(255, 0, 255, 0.6);
        }
        p {
            color: #b5bac1;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 70px; /* Evita que la tarjeta salte al cambiar el texto */
        }

        .estado-texto {
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 1px;
            transition: color 0.5s ease;
            text-transform: uppercase;
        }
        .estado-texto.iniciando { color: #80848e; }
        .estado-texto.activo {
            color: #23a559;
            text-shadow: 0 0 10px rgba(35, 165, 89, 0.5);
        }
        .estado-texto.error-texto {
            color: #ed4245;
            text-shadow: 0 0 10px rgba(237, 66, 69, 0.5);
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="avatar-container apagado" id="anillo-estado">
            <img src="{{ url_for('static', filename='fondodjzazy.png') }}" alt="Zazy DJ" class="avatar-img">
        </div>
        
        <h1>Panel de <span class="texto-zazy">ZAZY</span></h1>
        <!-- AÑADIDO: ID al párrafo para poder modificarlo con JS -->
        <p id="descripcion-estado">Señal enviada a los servidores. La mesa de mezclas se está encendiendo...</p>
        
        <div class="estado-texto iniciando" id="texto-estado">⚪ Despertando sistema...</div>
    </div>

    <!-- Script de conexión con la API -->
    <script>
        function comprobarEstado() {
            fetch('/status')
                .then(respuesta => respuesta.json())
                .then(datos => {
                    const anillo = document.getElementById('anillo-estado');
                    const texto = document.getElementById('texto-estado');
                    const descripcion = document.getElementById('descripcion-estado'); // Capturamos el párrafo
                    
                    if (datos.estado === "encendido") {
                        anillo.className = "avatar-container encendido";
                        texto.className = "estado-texto activo";
                        texto.innerHTML = "🟢 MODO DJ: ONLINE";
                        descripcion.innerHTML = "El motor está 100% operativo y conectado a Discord. Zazy DJ está listo para reventar los canales de voz.";
                    } else if (datos.estado === "error") {
                        anillo.className = "avatar-container error";
                        texto.className = "estado-texto error-texto";
                        texto.innerHTML = "🔴 ERROR EN EL SISTEMA";
                        descripcion.innerHTML = "Se ha producido un error crítico al arrancar los servidores. Revisa la consola de Render para más detalles.";
                    } else {
                        // Modo iniciando
                        anillo.className = "avatar-container apagado";
                        texto.className = "estado-texto iniciando";
                        texto.innerHTML = "⚪ Despertando sistema...";
                        descripcion.innerHTML = "Señal enviada a los servidores. La mesa de mezclas se está encendiendo...";
                        setTimeout(comprobarEstado, 2000);
                    }
                })
                .catch(error => console.error("Error de conexión:", error));
        }

        comprobarEstado();
    </script>
</body>
</html>
